apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomad-app
  labels:
    app: nomad
    component: app
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: nomad
      component: app
  template:
    metadata:
      labels:
        app: nomad
        component: app
    spec:
      containers:
      - name: app
        image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
        imagePullPolicy: {{ .Values.app.image.pullPolicy }}
        env:
          - name: NOMAD_SERVICE
            value: nomad_oasis_app
          - name: NOMAD_SERVICES_API_PORT
            value: "80"
          - name: NOMAD_FS_EXTERNAL_WORKING_DIRECTORY
            value: /app/.volumes/fs
          - name: NOMAD_RABBITMQ_HOST
            value: {{ if .Values.rabbitmq.enabled }}"rabbitmq"{{ else }}"{{ .Values.global.hosts.rabbitmq }}"{{ end }}
          - name: NOMAD_ELASTIC_HOST
            value: {{ if .Values.elasticsearch.enabled }}"{{ .Release.Name }}-elastic"{{ else }}"{{ .Values.global.hosts.elastic }}"{{ end }}
          - name: NOMAD_MONGO_HOST
            value: {{ if .Values.mongodb.enabled }}"{{ .Release.Name }}-mongodb"{{ else }}"{{ .Values.global.hosts.mongodb }}"{{ end }}
          - name: NOMAD_MONGO_USERNAME
            value: {{ .Values.mongodb.auth.rootUser | quote }}
          - name: NOMAD_MONGO_PASSWORD
            value: {{ .Values.mongodb.auth.rootPassword | quote }}
          - name: NOMAD_NORTH_HUB_HOST
            value: north
          {{- if .Values.global.proxy.http.host }}
          - name: HTTP_PROXY
            value: {{ printf "%s://%s:%s" .Values.global.proxy.http.protocol .Values.global.proxy.http.host .Values.global.proxy.http.port | quote }}
          {{- end }}
          {{- if .Values.global.proxy.https.host }}
          - name: HTTPS_PROXY
            value: {{ printf "%s://%s:%s" .Values.global.proxy.https.protocol .Values.global.proxy.https.host .Values.global.proxy.https.port | quote }}
          {{- end }}
          - name: NO_PROXY
            value: {{ .Values.global.proxy.no_proxy | quote }}
        ports:
        - containerPort: 80
        resources:
          {{- toYaml .Values.app.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /-/health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /-/health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        volumeMounts:
          - name: shared-volume
            mountPath: /app/.volumes/fs
      volumes:
      - name: shared-volume
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-fs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nomad-app
  labels:
    app: nomad
    component: app
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: nomad
    component: app
