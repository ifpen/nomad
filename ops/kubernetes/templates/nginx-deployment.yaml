{{- if and .Values.ingress.nginx.enabled (not .Values.ingress.useExistingController) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomad-nginx
  labels:
    app: nomad-nginx
spec:
  replicas: {{ .Values.ingress.nginx.replicaCount }}
  selector:
    matchLabels:
      app: nomad-nginx
  template:
    metadata:
      labels:
        app: nomad-nginx
    spec:
      containers:
      - name: nginx
        image: {{ .Values.ingress.nginx.image.repository }}:{{ .Values.ingress.nginx.image.tag }}
        imagePullPolicy: {{ .Values.ingress.nginx.image.pullPolicy }}
        ports:
        - containerPort: 80
        resources:
          {{- toYaml .Values.ingress.nginx.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nomad-nginx
spec:
  type: {{ .Values.ingress.nginx.service.type }}
  ports:
  - port: {{ .Values.ingress.nginx.service.port }}
    targetPort: 80
  selector:
    app: nomad-nginx
{{- end }}
