apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomad-worker
  labels:
    app: nomad
    component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: nomad
      component: worker
  template:
    metadata:
      labels:
        app: nomad
        component: worker
    spec:
      containers:
      - name: worker
        image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
        imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
        env:
          - name: NOMAD_SERVICE
            value: nomad_oasis_worker
          - name: NOMAD_FS_EXTERNAL_WORKING_DIRECTORY
            value: /app/.volumes/fs
          - name: NOMAD_RABBITMQ_HOST
            value: {{ if .Values.rabbitmq.enabled }}"rabbitmq"{{ else }}"{{ .Values.global.hosts.rabbitmq }}"{{ end }}
          - name: NOMAD_ELASTIC_HOST
            value: {{ if .Values.elasticsearch.enabled }}"{{ .Release.Name }}-elastic"{{ else }}"{{ .Values.global.hosts.elastic }}"{{ end }}
          - name: NOMAD_MONGO_HOST
            value: {{ if .Values.mongodb.enabled }}"{{ .Release.Name }}-mongodb"{{ else }}"{{ .Values.global.hosts.mongodb }}"{{ end }}
          - name: NOMAD_MONGO_USERNAME
            value: {{ .Values.mongodb.auth.rootUser | quote }}
          - name: NOMAD_MONGO_PASSWORD
            value: {{ .Values.mongodb.auth.rootPassword | quote }}
          {{- if .Values.global.proxy.http.host }}
          - name: HTTP_PROXY
            value: {{ printf "%s://%s:%s" .Values.global.proxy.http.protocol .Values.global.proxy.http.host .Values.global.proxy.http.port | quote }}
          {{- end }}
          {{- if .Values.global.proxy.https.host }}
          - name: HTTPS_PROXY
            value: {{ printf "%s://%s:%s" .Values.global.proxy.https.protocol .Values.global.proxy.https.host .Values.global.proxy.https.port | quote }}
          {{- end }}
          - name: NO_PROXY
            value: {{ .Values.global.proxy.no_proxy | quote }}
        command: ["./run-worker.sh"]
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
        volumeMounts:
          - name: shared-volume
            mountPath: /app/.volumes/fs
          - name: config-volume
            mountPath: /app/.config
            subPath: nomad.yaml
      volumes:
      - name: shared-volume
        persistentVolumeClaim:
          claimName: {{ .Release.Name }}-fs-pvc
      - name: config-volume
        configMap:
          name: nomad-config
