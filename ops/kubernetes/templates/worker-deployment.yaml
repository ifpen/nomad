apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomad-worker
  labels:
    app: nomad
    component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: nomad
      component: worker
  template:
    metadata:
      labels:
        app: nomad
        component: worker
    spec:
      containers:
      - name: worker
        image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
        imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
        env:
          {{- range $key, $value := .Values.worker.env }}
          - name: {{ $key }}
            value: {{ $value | quote }}
          {{- end }}
          - name: NOMAD_MONGO_USERNAME
            value: {{ .Values.mongodb.auth.rootUser | quote }}
          - name: NOMAD_MONGO_PASSWORD
            value: {{ .Values.mongodb.auth.rootPassword | quote }}
          {{- if .Values.global.proxy.http.host }}
          - name: HTTP_PROXY
            value: {{ printf "%s://%s:%s" .Values.global.proxy.http.protocol .Values.global.proxy.http.host .Values.global.proxy.http.port | quote }}
          {{- end }}
          {{- if .Values.global.proxy.https.host }}
          - name: HTTPS_PROXY
            value: {{ printf "%s://%s:%s" .Values.global.proxy.https.protocol .Values.global.proxy.https.host .Values.global.proxy.https.port | quote }}
          {{- end }}
          - name: NO_PROXY
            value: {{ .Values.global.proxy.no_proxy | quote }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
        volumeMounts:
          - name: shared-volume
            mountPath: /app/.volumes/fs
      volumes:
      - name: shared-volume
        persistentVolumeClaim:
          claimName: nomad-fs-pvc
